<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100e19"><title>KILLER · Carte segrete</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff9f4;background:#100e19}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 15%,#38233f 0%,#181321 50%,#100e19 100%)}main{max-width:520px;margin:auto;min-height:100dvh;padding:35px 22px 42px;display:flex;flex-direction:column;align-items:center}.eyebrow{font-size:11px;letter-spacing:3px;color:#e6a4a8;font-weight:800}.logo{font-family:Georgia,serif;font-size:clamp(58px,15vw,86px);letter-spacing:-5px;margin:5px 0 0}.logo em{color:#f17685;font-style:normal}.subtitle{color:#c4b7c7;text-align:center;line-height:1.5;margin:6px 0 26px}.panel{width:100%;background:#ffffff09;border:1px solid #ffffff1d;border-radius:24px;padding:24px}.setting{margin:0 0 20px}.setting label{display:block;color:#e8dce9;font-size:14px;font-weight:700;margin-bottom:10px}.stepper{display:flex;justify-content:space-between;align-items:center;border:1px solid #ffffff22;border-radius:16px;padding:7px;background:#0d0c17}.stepper button{background:#ffffff14;color:#fff;border:0;width:48px;height:45px;border-radius:12px;font-size:27px;cursor:pointer}.stepper output{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}.primary{width:100%;background:#f07b8b;border:0;border-radius:15px;padding:17px;color:#24111b;font-size:16px;font-weight:850;cursor:pointer}.secondary{background:transparent;border:1px solid #ffffff35;color:#fff;border-radius:14px;padding:13px 20px;cursor:pointer}.hint{font-size:13px;color:#b8aab9;text-align:center}.hidden{display:none!important}#game{width:100%;display:flex;flex-direction:column;align-items:center;flex:1}.topline{display:flex;justify-content:space-between;width:100%;color:#c8b6c8;font-size:13px;margin:12px 0 25px}.cardButton{border:0;background:none;padding:0;cursor:pointer;perspective:1100px;width:min(75vw,310px);height:min(109vw,430px);max-height:52dvh;min-height:300px;touch-action:manipulation}.cardInner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.75,.25,1)}.cardButton.flipped .cardInner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:23px;border:2px solid #d7a99d;box-shadow:0 18px 55px #0008, inset 0 0 0 7px #261b30;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.back{background:repeating-linear-gradient(45deg,#33253e 0 7px,#3b2a46 7px 14px)}.ornament{border:2px solid #d7a99d88;position:absolute;inset:15px;border-radius:14px;pointer-events:none}.backIcon{font-family:Georgia,serif;font-size:115px;color:#e6acb4;text-shadow:0 4px 25px #0005}.backTitle{letter-spacing:5px;font-size:14px;font-weight:900;color:#f1c6c8}.front{transform:rotateY(180deg);background:linear-gradient(150deg,#f7e8d5,#e7cbb9);color:#251a25}.front.killer{background:linear-gradient(150deg,#542334,#240e1a);color:#ffe0dd}.front.detective{background:linear-gradient(150deg,#1f4962,#102234);color:#d8f4ff}.front.civilian{background:linear-gradient(150deg,#f5e8d5,#d8c7ae);color:#302a28}.roleIcon{font-size:78px}.roleTitle{font-family:Georgia,serif;font-size:35px;margin:18px 0 8px}.roleDesc{font-size:14px;line-height:1.5;max-width:220px;text-align:center}.prompt{font-size:17px;font-weight:700;text-align:center;margin:24px 0 8px}.note{font-size:13px;color:#baa9bc;text-align:center;max-width:290px;line-height:1.5}.finish{text-align:center;margin:auto 0}.finishIcon{font-size:84px}.finish h2{font-family:Georgia,serif;font-size:42px}.actions{width:100%;margin-top:auto;padding-top:25px}.actions button+button{margin-top:10px}.dots{display:flex;gap:5px;justify-content:center;margin:8px 0 0}.dot{width:6px;height:6px;border-radius:50%;background:#ffffff30}.dot.active{background:#f07b8b}@media(prefers-reduced-motion:reduce){.cardInner{transition:none}}
</style></head><body><main><div class="eyebrow">THE SECRET ROLE GAME</div><h1 class="logo">KILLER<em>.</em></h1><p class="subtitle" id="subtitle">Un telefono. Una carta. Nessun testimone.</p><section id="setup" class="panel"><div class="setting"><label>Giocatori</label><div class="stepper"><button data-field="players" data-delta="-1" aria-label="Meno giocatori">−</button><output id="playersValue">20</output><button data-field="players" data-delta="1" aria-label="Più giocatori">+</button></div></div><div class="setting"><label>Assassini</label><div class="stepper"><button data-field="killers" data-delta="-1" aria-label="Meno assassini">−</button><output id="killersValue">2</output><button data-field="killers" data-delta="1" aria-label="Più assassini">+</button></div></div><div class="setting"><label>Detective</label><div class="stepper"><button data-field="detectives" data-delta="-1" aria-label="Meno detective">−</button><output id="detectivesValue">2</output><button data-field="detectives" data-delta="1" aria-label="Più detective">+</button></div></div><p class="hint" id="summary"></p><button class="primary" id="start">Mescola le carte →</button><p class="hint" id="error" role="alert"></p></section><section id="game" class="hidden"><div class="topline"><span id="counter"></span><span>RUOLO SEGRETO</span></div><button id="card" class="cardButton" aria-label="Gira la carta"><div class="cardInner"><div class="face back"><div class="ornament"></div><div class="backIcon">♠</div><div class="backTitle">KILLER</div></div><div class="face front" id="front"><div class="ornament"></div><div class="roleIcon" id="roleIcon"></div><div class="roleTitle" id="roleTitle"></div><div class="roleDesc" id="roleDesc"></div></div></div></button><p class="prompt" id="prompt">Tocca la carta per scoprire il ruolo</p><p class="note" id="note">Solo il giocatore di turno deve guardare lo schermo.</p><div class="actions"><div class="dots" id="dots"></div></div></section><section id="finish" class="finish hidden"><div class="finishIcon">🂠</div><h2>Che il gioco inizi.</h2><p class="subtitle">Tutti i ruoli sono stati distribuiti.</p><button id="replay" class="primary">Rimescola e rigioca</button><button id="settings" class="secondary" style="margin-top:12px;width:100%">Cambia impostazioni</button></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const state={players:20,killers:2,detectives:2,roles:[],index:0,flipped:false,locked:false};function refresh(){for(const k of ['players','killers','detectives'])$(k+'Value').textContent=state[k];$('summary').textContent=(state.players-state.killers-state.detectives)+' civili · '+state.killers+' assassini · '+state.detectives+' detective';}document.querySelectorAll('[data-field]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.field,d=Number(b.dataset.delta);state[k]=Math.max(k==='players'?3:k==='killers'?1:0,Math.min(k==='players'?100:99,state[k]+d));refresh()}));function view(id){for(const x of ['setup','game','finish'])$(x).classList.toggle('hidden',x!==id)}function shuffle(a){for(let i=a.length-1;i>0;i--){const b=new Uint32Array(1);crypto.getRandomValues(b);const j=b[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function begin(){if(state.killers+state.detectives>state.players){$('error').textContent='Ci sono più ruoli speciali che giocatori.';return}$('error').textContent='';state.roles=shuffle([...Array(state.killers).fill('killer'),...Array(state.detectives).fill('detective'),...Array(state.players-state.killers-state.detectives).fill('civilian')]);state.index=0;state.locked=false;view('game');prepare()}function prepare(){state.flipped=false;$('card').classList.remove('flipped');$('counter').textContent='GIOCATORE '+(state.index+1)+' / '+state.players;$('prompt').textContent='Tocca la carta per scoprire il ruolo';$('note').textContent='Solo il giocatore di turno deve guardare lo schermo.';$('dots').replaceChildren();const dot=document.createElement('span');dot.className='dot active';$('dots').append(dot)}function cardClick(){if(state.locked)return;state.locked=true;if(!state.flipped){const data={killer:['🗡️','ASSASSINO','Elimina con un occhiolino, senza farti scoprire.'],detective:['🔎','DETECTIVE','Scopri chi sono gli assassini.'],civilian:['🕯️','CIVILE','Sopravvivi e osserva con attenzione.']}[state.roles[state.index]];const front=$('front');front.className='face front '+state.roles[state.index];$('roleIcon').textContent=data[0];$('roleTitle').textContent=data[1];$('roleDesc').textContent=data[2];state.flipped=true;$('card').classList.add('flipped');$('prompt').textContent='Tocca di nuovo per nascondere';$('note').textContent='Memorizza il ruolo. Poi passa il telefono.';setTimeout(()=>state.locked=false,680)}else{state.flipped=false;$('card').classList.remove('flipped');$('prompt').textContent='Carta nascosta';$('note').textContent='Passa il telefono al prossimo giocatore.';setTimeout(()=>{state.index++;state.locked=false;if(state.index>=state.players)view('finish');else prepare()},680)}}$('card').addEventListener('click',cardClick);$('start').addEventListener('click',begin);$('replay').addEventListener('click',begin);$('settings').addEventListener('click',()=>view('setup'));refresh()})();
</script></body></html>
